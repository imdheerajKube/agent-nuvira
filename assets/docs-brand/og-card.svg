<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="nuvira" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#6366f1"/>
    <stop offset="52%" stop-color="#8b5cf6"/>
    <stop offset="100%" stop-color="#a78bfa"/>
  </linearGradient>
    <radialGradient id="glowA" cx="18%" cy="26%" r="55%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="84%" cy="76%" r="52%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hairline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0"/>
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="#06060e"/>
  <rect width="1200" height="630" fill="url(#glowA)"/>
  <rect width="1200" height="630" fill="url(#glowB)"/>

  <!-- mark -->
  <g transform="translate(80, 74) scale(1.15)">
    <rect width="64" height="64" rx="15" fill="url(#nuvira)"/>
    <path d="M32 11 L48 32 L32 53 L16 32 Z" fill="#ffffff"/>
  <path d="M32 21 L41 32 L32 43 L23 32 Z" fill="#6366f1" fill-opacity="0.5"/>
  </g>

  <!-- wordmark -->
  <text x="182" y="122" font-family="Helvetica, Arial, sans-serif" font-size="46" font-weight="400" fill="#f0f0f5">Agent-<tspan font-weight="700">Nuvira</tspan></text>

  <!-- tagline -->
  <text x="80" y="248" font-family="Helvetica, Arial, sans-serif" font-size="62" font-weight="700" fill="#f0f0f5">Multi-agent AI coding CLI</text>
  <text x="80" y="300" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="400" fill="#a9a9c4">Plan, write, review, test and publish — from a terminal, a dashboard,</text>
  <text x="80" y="338" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="400" fill="#a9a9c4">or any of 22 messaging platforms. Local models or cloud APIs.</text>

  <rect x="80" y="372" width="1040" height="2" fill="url(#hairline)"/>

  <!-- a real session, because a card that shows the product beats one that lists it -->
  <rect x="80" y="412" width="1040" height="150" rx="14" fill="#0b0b18" stroke="#25254a" stroke-width="1"/>
  <circle cx="108" cy="438" r="6" fill="#ff5f57"/>
  <circle cx="130" cy="438" r="6" fill="#febc2e"/>
  <circle cx="152" cy="438" r="6" fill="#28c840"/>
  <g font-family="Menlo, Consolas, monospace" font-size="21">
    <text x="108" y="482" fill="#a78bfa">$ nuvira doctor</text>
    <text x="108" y="514" fill="#a9a9c4">$ nuvira workflow run bug-hunt "login fails with a plus sign"</text>
    <text x="108" y="546" fill="#a9a9c4">$ nuvira skill run security-audit --dry-run</text>
  </g>

  <text x="80" y="606" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="600" fill="#a78bfa">No telemetry</text>
  <text x="238" y="606" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#25254a">·</text>
  <text x="256" y="606" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="600" fill="#a78bfa">Bring your own keys</text>
  <text x="475" y="606" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#25254a">·</text>
  <text x="493" y="606" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="600" fill="#a78bfa">MIT licensed</text>
</svg>
