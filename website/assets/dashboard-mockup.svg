<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <defs>
    <linearGradient id="bgd" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b0b18"/>
      <stop offset="100%" stop-color="#06060e"/>
    </linearGradient>
    <linearGradient id="glowd" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="purpGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="bgGlowd">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
    <filter id="glowFilter">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#6366f1" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgd)" rx="16"/>
  <ellipse cx="400" cy="250" rx="350" ry="200" fill="url(#glowd)" filter="url(#bgGlowd)"/>

  <!-- Window chrome -->
  <rect x="0" y="0" width="800" height="40" rx="16" fill="#0d0d1f"/>
  <rect x="0" y="20" width="800" height="20" fill="#0d0d1f"/>
  <!-- Window buttons -->
  <circle cx="20" cy="20" r="5" fill="#ef4444"/>
  <circle cx="40" cy="20" r="5" fill="#f59e0b"/>
  <circle cx="60" cy="20" r="5" fill="#10b981"/>
  <!-- Title -->
  <rect x="300" y="12" width="200" height="16" rx="8" fill="rgba(99,102,241,0.08)"/>
  <text x="400" y="24" text-anchor="middle" fill="#9090b0" font-family="Inter, system-ui, sans-serif" font-size="9">dashboard — localhost:3000</text>

  <!-- Sidebar -->
  <rect x="0" y="40" width="160" height="460" fill="#090915"/>
  <!-- Nav items -->
  <g transform="translate(16, 60)">
    <rect x="0" y="0" width="128" height="28" rx="6" fill="rgba(99,102,241,0.12)"/>
    <text x="14" y="18" fill="#a78bfa" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600">📊 Overview</text>
    <rect x="0" y="36" width="128" height="28" rx="6" fill="transparent"/>
    <text x="14" y="54" fill="#606080" font-family="Inter, system-ui, sans-serif" font-size="11">🔀 DAG View</text>
    <rect x="0" y="72" width="128" height="28" rx="6" fill="transparent"/>
    <text x="14" y="90" fill="#606080" font-family="Inter, system-ui, sans-serif" font-size="11">📈 Models</text>
    <rect x="0" y="108" width="128" height="28" rx="6" fill="transparent"/>
    <text x="14" y="126" fill="#606080" font-family="Inter, system-ui, sans-serif" font-size="11">📁 History</text>
    <rect x="0" y="144" width="128" height="28" rx="6" fill="transparent"/>
    <text x="14" y="162" fill="#606080" font-family="Inter, system-ui, sans-serif" font-size="11">💰 Cost</text>
    <rect x="0" y="180" width="128" height="28" rx="6" fill="transparent"/>
    <text x="14" y="198" fill="#606080" font-family="Inter, system-ui, sans-serif" font-size="11">❤️ Health</text>
  </g>

  <!-- Main content area -->
  <!-- Pipeline status header -->
  <rect x="180" y="56" width="600" height="44" rx="10" fill="#111125" stroke="rgba(99,102,241,0.15)" stroke-width="1"/>
  <text x="200" y="76" fill="#f0f0f5" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600">⚡ Active Pipeline: "Add JWT Authentication"</text>
  <rect x="640" y="62" width="120" height="28" rx="14" fill="rgba(16,185,129,0.12)" stroke="rgba(16,185,129,0.3)" stroke-width="0.5"/>
  <text x="700" y="81" text-anchor="middle" fill="#34d399" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="600">● Running (3/6)</text>

  <!-- DAG Visualization area -->
  <rect x="180" y="112" width="600" height="220" rx="10" fill="#111125" stroke="rgba(99,102,241,0.08)" stroke-width="1"/>

  <!-- DAG Nodes -->
  <!-- Plan node -->
  <rect x="320" y="130" width="100" height="34" rx="17" fill="rgba(99,102,241,0.15)" stroke="rgba(99,102,241,0.4)" stroke-width="1.5" filter="url(#glowFilter)"/>
  <text x="370" y="152" text-anchor="middle" fill="#a78bfa" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600">📋 Plan</text>
  <text x="320" y="178" text-anchor="middle" fill="#34d399" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="500">✅ completed</text>

  <!-- Gather node -->
  <rect x="210" y="200" width="100" height="34" rx="17" fill="rgba(6,182,212,0.15)" stroke="rgba(6,182,212,0.4)" stroke-width="1.5"/>
  <text x="260" y="222" text-anchor="middle" fill="#22d3ee" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600">📁 Gather</text>
  <text x="210" y="248" text-anchor="middle" fill="#34d399" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="500">✅ completed</text>

  <!-- Write node -->
  <rect x="340" y="200" width="100" height="34" rx="17" fill="rgba(139,92,246,0.15)" stroke="rgba(139,92,246,0.4)" stroke-width="1.5"/>
  <text x="390" y="222" text-anchor="middle" fill="#c4b5fd" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600">✍️ Write</text>
  <text x="340" y="248" text-anchor="middle" fill="#fbbf24" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="500">⏳ in progress</text>

  <!-- Review node -->
  <rect x="470" y="200" width="100" height="34" rx="17" fill="rgba(16,185,129,0.1)" stroke="rgba(16,185,129,0.2)" stroke-width="1"/>
  <text x="520" y="222" text-anchor="middle" fill="#34d399" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600">👀 Review</text>
  <text x="470" y="248" text-anchor="middle" fill="#606080" font-family="Inter, system-ui, sans-serif" font-size="9">⏸ pending</text>

  <!-- Test node -->
  <rect x="270" y="270" width="100" height="34" rx="17" fill="rgba(245,158,11,0.1)" stroke="rgba(245,158,11,0.2)" stroke-width="1"/>
  <text x="320" y="292" text-anchor="middle" fill="#fbbf24" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600">🧪 Test</text>
  <text x="270" y="318" text-anchor="middle" fill="#606080" font-family="Inter, system-ui, sans-serif" font-size="9">⏸ pending</text>

  <!-- Ship node -->
  <rect x="420" y="270" width="100" height="34" rx="17" fill="rgba(16,185,129,0.1)" stroke="rgba(16,185,129,0.2)" stroke-width="1"/>
  <text x="470" y="292" text-anchor="middle" fill="#34d399" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600">🚀 Ship</text>
  <text x="420" y="318" text-anchor="middle" fill="#606080" font-family="Inter, system-ui, sans-serif" font-size="9">⏸ pending</text>

  <!-- DAG edges -->
  <!-- Plan → Gather -->
  <line x1="370" y1="164" x2="310" y2="196" stroke="rgba(99,102,241,0.3)" stroke-width="1"/>
  <polygon points="306,200 318,192 316,204" fill="rgba(99,102,241,0.4)"/>
  <!-- Plan → Write -->
  <line x1="370" y1="164" x2="390" y2="196" stroke="rgba(99,102,241,0.3)" stroke-width="1"/>
  <polygon points="390,200 382,192 398,196" fill="rgba(99,102,241,0.4)"/>
  <!-- Plan → Review -->
  <line x1="370" y1="164" x2="520" y2="196" stroke="rgba(99,102,241,0.15)" stroke-width="1" stroke-dasharray="3 3"/>
  <!-- Gather → Test -->
  <line x1="260" y1="234" x2="320" y2="266" stroke="rgba(99,102,241,0.2)" stroke-width="1" stroke-dasharray="3 3"/>
  <!-- Write → Test -->
  <line x1="390" y1="234" x2="370" y2="266" stroke="rgba(99,102,241,0.2)" stroke-width="1" stroke-dasharray="3 3"/>
  <!-- Review → Ship -->
  <line x1="520" y1="234" x2="470" y2="266" stroke="rgba(99,102,241,0.15)" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- Bottom panel: Metrics -->
  <rect x="180" y="344" width="290" height="68" rx="10" fill="#111125" stroke="rgba(99,102,241,0.08)" stroke-width="1"/>
  <text x="200" y="366" fill="#9090b0" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="500">SESSION METRICS</text>
  <!-- Metric 1 -->
  <text x="200" y="390" fill="#606080" font-family="Inter, system-ui, sans-serif" font-size="9">Tokens Used</text>
  <text x="260" y="390" fill="#f0f0f5" font-family="JetBrains Mono, monospace" font-size="9" font-weight="500">12,847</text>
  <!-- Metric 2 -->
  <text x="320" y="390" fill="#606080" font-family="Inter, system-ui, sans-serif" font-size="9">Duration</text>
  <text x="380" y="390" fill="#f0f0f5" font-family="JetBrains Mono, monospace" font-size="9" font-weight="500">34.2s</text>
  <!-- Metric 3 -->
  <text x="200" y="404" fill="#606080" font-family="Inter, system-ui, sans-serif" font-size="9">Model</text>
  <text x="250" y="404" fill="#f0f0f5" font-family="JetBrains Mono, monospace" font-size="9" font-weight="500">groq/llama-3.3-70b</text>

  <!-- Provider health panel -->
  <rect x="490" y="344" width="290" height="68" rx="10" fill="#111125" stroke="rgba(99,102,241,0.08)" stroke-width="1"/>
  <text x="510" y="366" fill="#9090b0" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="500">PROVIDER HEALTH</text>
  <!-- Provider indicators -->
  <g transform="translate(510, 378)">
    <rect x="0" y="0" width="46" height="20" rx="10" fill="rgba(16,185,129,0.12)"/>
    <circle cx="12" cy="10" r="3" fill="#10b981"/>
    <text x="20" y="14" fill="#34d399" font-family="Inter, system-ui, sans-serif" font-size="8">Groq</text>
    <rect x="54" y="0" width="56" height="20" rx="10" fill="rgba(16,185,129,0.12)"/>
    <circle cx="66" cy="10" r="3" fill="#10b981"/>
    <text x="74" y="14" fill="#34d399" font-family="Inter, system-ui, sans-serif" font-size="8">Gemini</text>
    <rect x="118" y="0" width="52" height="20" rx="10" fill="rgba(245,158,11,0.12)"/>
    <circle cx="130" cy="10" r="3" fill="#f59e0b"/>
    <text x="138" y="14" fill="#fbbf24" font-family="Inter, system-ui, sans-serif" font-size="8">NIM</text>
    <rect x="0" y="26" width="46" height="20" rx="10" fill="rgba(16,185,129,0.12)"/>
    <circle cx="12" cy="36" r="3" fill="#10b981"/>
    <text x="20" y="40" fill="#34d399" font-family="Inter, system-ui, sans-serif" font-size="8">Ollama</text>
    <rect x="54" y="26" width="46" height="20" rx="10" fill="rgba(239,68,68,0.12)"/>
    <circle cx="66" cy="36" r="3" fill="#ef4444"/>
    <text x="74" y="40" fill="#f87171" font-family="Inter, system-ui, sans-serif" font-size="8">Router</text>
  </g>

  <!-- History timeline -->
  <rect x="180" y="424" width="600" height="56" rx="10" fill="#111125" stroke="rgba(99,102,241,0.08)" stroke-width="1"/>
  <text x="200" y="444" fill="#9090b0" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="500">RECENT PIPELINES</text>
  <g transform="translate(200, 454)">
    <text fill="#34d399" font-family="Inter, system-ui, sans-serif" font-size="9">✅</text>
    <text x="18" y="12" fill="#f0f0f5" font-family="Inter, system-ui, sans-serif" font-size="9">Add JWT auth</text>
    <text x="140" y="12" fill="#606080" font-family="Inter, system-ui, sans-serif" font-size="8">34.2s</text>

    <text x="180" y="12" fill="#34d399" font-family="Inter, system-ui, sans-serif" font-size="9">✅</text>
    <text x="198" y="12" fill="#f0f0f5" font-family="Inter, system-ui, sans-serif" font-size="9">Fix login bug</text>
    <text x="310" y="12" fill="#606080" font-family="Inter, system-ui, sans-serif" font-size="8">12.1s</text>

    <text x="350" y="12" fill="#f87171" font-family="Inter, system-ui, sans-serif" font-size="9">❌</text>
    <text x="368" y="12" fill="#f0f0f5" font-family="Inter, system-ui, sans-serif" font-size="9">Deploy to prod</text>
    <text x="488" y="12" fill="#606080" font-family="Inter, system-ui, sans-serif" font-size="8">5.3s</text>
  </g>
</svg>
