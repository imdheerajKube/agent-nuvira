<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b0b18"/>
      <stop offset="100%" stop-color="#06060e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="nodeGlow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="bgGlow">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg)" rx="16"/>
  <ellipse cx="400" cy="250" rx="300" ry="200" fill="url(#glow)" filter="url(#bgGlow)"/>

  <!-- Grid lines -->
  <g stroke="rgba(99,102,241,0.06)" stroke-width="0.5">
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="200" y1="0" x2="200" y2="500"/>
    <line x1="400" y1="0" x2="400" y2="500"/>
    <line x1="600" y1="0" x2="600" y2="500"/>
  </g>

  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" fill="#9090b0" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="500" letter-spacing="2">MULTI-AGENT PIPELINE</text>

  <!-- User Goal Input -->
  <rect x="290" y="60" width="220" height="36" rx="18" fill="rgba(99,102,241,0.12)" stroke="rgba(99,102,241,0.3)" stroke-width="1"/>
  <text x="400" y="83" text-anchor="middle" fill="#f0f0f5" font-family="JetBrains Mono, monospace" font-size="11">$ agent-nuvira execute "add auth"</text>

  <!-- Arrow down -->
  <line x1="400" y1="96" x2="400" y2="120" stroke="rgba(99,102,241,0.4)" stroke-width="1.5"/>
  <polygon points="400,126 395,118 405,118" fill="rgba(99,102,241,0.6)"/>

  <!-- Pipeline Nodes -->
  <!-- Node 1: Planner -->
  <rect x="60" y="135" width="120" height="44" rx="10" fill="#111125" stroke="rgba(99,102,241,0.3)" stroke-width="1" filter="url(#nodeGlow)"/>
  <text x="120" y="155" text-anchor="middle" fill="#6366f1" font-family="Inter, system-ui, sans-serif" font-size="16">🧠</text>
  <text x="120" y="172" text-anchor="middle" fill="#f0f0f5" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600">Planner</text>

  <!-- Node 2: Gatherer -->
  <rect x="250" y="135" width="120" height="44" rx="10" fill="#111125" stroke="rgba(6,182,212,0.3)" stroke-width="1" filter="url(#nodeGlow)"/>
  <text x="310" y="155" text-anchor="middle" fill="#06b6d4" font-family="Inter, system-ui, sans-serif" font-size="16">📁</text>
  <text x="310" y="172" text-anchor="middle" fill="#f0f0f5" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600">Gatherer</text>

  <!-- Node 3: Writer -->
  <rect x="440" y="135" width="120" height="44" rx="10" fill="#111125" stroke="rgba(139,92,246,0.3)" stroke-width="1" filter="url(#nodeGlow)"/>
  <text x="500" y="155" text-anchor="middle" fill="#a78bfa" font-family="Inter, system-ui, sans-serif" font-size="16">✍️</text>
  <text x="500" y="172" text-anchor="middle" fill="#f0f0f5" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600">Writer</text>

  <!-- Node 4: Reviewer -->
  <rect x="630" y="135" width="120" height="44" rx="10" fill="#111125" stroke="rgba(16,185,129,0.3)" stroke-width="1" filter="url(#nodeGlow)"/>
  <text x="690" y="155" text-anchor="middle" fill="#10b981" font-family="Inter, system-ui, sans-serif" font-size="16">👀</text>
  <text x="690" y="172" text-anchor="middle" fill="#f0f0f5" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600">Reviewer</text>

  <!-- Horizontal arrows between nodes -->
  <line x1="180" y1="157" x2="240" y2="157" stroke="rgba(99,102,241,0.3)" stroke-width="1.5"/>
  <polygon points="246,157 238,152 238,162" fill="rgba(99,102,241,0.5)"/>

  <line x1="370" y1="157" x2="430" y2="157" stroke="rgba(99,102,241,0.3)" stroke-width="1.5"/>
  <polygon points="436,157 428,152 428,162" fill="rgba(99,102,241,0.5)"/>

  <line x1="560" y1="157" x2="620" y2="157" stroke="rgba(99,102,241,0.3)" stroke-width="1.5"/>
  <polygon points="626,157 618,152 618,162" fill="rgba(99,102,241,0.5)"/>

  <!-- Description labels -->
  <text x="120" y="210" text-anchor="middle" fill="#9090b0" font-family="Inter, system-ui, sans-serif" font-size="10">Analyze goal</text>
  <text x="120" y="225" text-anchor="middle" fill="#9090b0" font-family="Inter, system-ui, sans-serif" font-size="10">Create plan</text>

  <text x="310" y="210" text-anchor="middle" fill="#9090b0" font-family="Inter, system-ui, sans-serif" font-size="10">Scan codebase</text>
  <text x="310" y="225" text-anchor="middle" fill="#9090b0" font-family="Inter, system-ui, sans-serif" font-size="10">Find context</text>

  <text x="500" y="210" text-anchor="middle" fill="#9090b0" font-family="Inter, system-ui, sans-serif" font-size="10">Generate code</text>
  <text x="500" y="225" text-anchor="middle" fill="#9090b0" font-family="Inter, system-ui, sans-serif" font-size="10">Apply changes</text>

  <text x="690" y="210" text-anchor="middle" fill="#9090b0" font-family="Inter, system-ui, sans-serif" font-size="10">Validate code</text>
  <text x="690" y="225" text-anchor="middle" fill="#9090b0" font-family="Inter, system-ui, sans-serif" font-size="10">Check quality</text>

  <!-- Arrow down to second row -->
  <line x1="400" y1="240" x2="400" y2="270" stroke="rgba(99,102,241,0.4)" stroke-width="1.5"/>
  <polygon points="400,276 395,268 405,268" fill="rgba(99,102,241,0.6)"/>

  <!-- Second Row: Tester & Debugger -->
  <rect x="120" y="285" width="120" height="44" rx="10" fill="#111125" stroke="rgba(245,158,11,0.3)" stroke-width="1" filter="url(#nodeGlow)"/>
  <text x="180" y="305" text-anchor="middle" fill="#f59e0b" font-family="Inter, system-ui, sans-serif" font-size="16">🧪</text>
  <text x="180" y="322" text-anchor="middle" fill="#f0f0f5" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600">Tester</text>

  <rect x="290" y="285" width="120" height="44" rx="10" fill="#111125" stroke="rgba(239,68,68,0.3)" stroke-width="1" filter="url(#nodeGlow)"/>
  <text x="350" y="305" text-anchor="middle" fill="#ef4444" font-family="Inter, system-ui, sans-serif" font-size="16">🐛</text>
  <text x="350" y="322" text-anchor="middle" fill="#f0f0f5" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600">Debugger</text>

  <!-- Parallel mark -->
  <text x="250" y="315" text-anchor="middle" fill="rgba(99,102,241,0.5)" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700">∥</text>

  <!-- Labels -->
  <text x="180" y="358" text-anchor="middle" fill="#9090b0" font-family="Inter, system-ui, sans-serif" font-size="10">Run tests</text>
  <text x="180" y="373" text-anchor="middle" fill="#9090b0" font-family="Inter, system-ui, sans-serif" font-size="10">In sandbox</text>

  <text x="350" y="358" text-anchor="middle" fill="#9090b0" font-family="Inter, system-ui, sans-serif" font-size="10">Fix failures</text>
  <text x="350" y="373" text-anchor="middle" fill="#9090b0" font-family="Inter, system-ui, sans-serif" font-size="10">Iterate</text>

  <!-- Error recovery loop arrow -->
  <path d="M 410 325 Q 450 300 480 300 Q 510 300 510 270 Q 510 240 480 240 L 450 240" stroke="rgba(245,158,11,0.3)" stroke-width="1.2" fill="none" stroke-dasharray="4 3"/>
  <text x="490" y="295" text-anchor="middle" fill="rgba(245,158,11,0.4)" font-family="Inter, system-ui, sans-serif" font-size="9">auto-repair</text>

  <!-- Arrow down to ship -->
  <line x1="400" y1="385" x2="400" y2="410" stroke="rgba(99,102,241,0.4)" stroke-width="1.5"/>
  <polygon points="400,416 395,408 405,408" fill="rgba(99,102,241,0.6)"/>

  <!-- Ship Node -->
  <rect x="290" y="425" width="220" height="44" rx="22" fill="rgba(16,185,129,0.12)" stroke="rgba(16,185,129,0.4)" stroke-width="1" filter="url(#nodeGlow)"/>
  <text x="400" y="452" text-anchor="middle" fill="#10b981" font-family="Inter, system-ui, sans-serif" font-size="14">🚀  Ship to Production</text>

  <!-- Feature badges -->
  <g transform="translate(650, 290)">
    <rect x="0" y="0" width="130" height="24" rx="12" fill="rgba(99,102,241,0.08)" stroke="rgba(99,102,241,0.15)" stroke-width="0.5"/>
    <text x="65" y="16" text-anchor="middle" fill="#a78bfa" font-family="Inter, system-ui, sans-serif" font-size="9">⚡ Parallel Execution</text>

    <rect x="0" y="32" width="130" height="24" rx="12" fill="rgba(6,182,212,0.08)" stroke="rgba(6,182,212,0.15)" stroke-width="0.5"/>
    <text x="65" y="48" text-anchor="middle" fill="#22d3ee" font-family="Inter, system-ui, sans-serif" font-size="9">🔄 Auto Error Recovery</text>

    <rect x="0" y="64" width="130" height="24" rx="12" fill="rgba(16,185,129,0.08)" stroke="rgba(16,185,129,0.15)" stroke-width="0.5"/>
    <text x="65" y="80" text-anchor="middle" fill="#34d399" font-family="Inter, system-ui, sans-serif" font-size="9">🧠 Self-Learning</text>

    <rect x="0" y="96" width="130" height="24" rx="12" fill="rgba(139,92,246,0.08)" stroke="rgba(139,92,246,0.15)" stroke-width="0.5"/>
    <text x="65" y="112" text-anchor="middle" fill="#c4b5fd" font-family="Inter, system-ui, sans-serif" font-size="9">🔌 Plugin System</text>
  </g>
</svg>
