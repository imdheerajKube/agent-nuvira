<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 860" width="1100" height="860">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f1117"/>
      <stop offset="100%" stop-color="#1a1d2e"/>
    </linearGradient>
    <linearGradient id="headerGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="plan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="gather" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="write" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="review" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="test" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#f87171"/>
    </linearGradient>
    <linearGradient id="ship" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#c4b5fd"/>
    </linearGradient>
    <linearGradient id="publish" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#f9a8d4"/>
    </linearGradient>
    <linearGradient id="extend" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <linearGradient id="orchestrate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e2238"/>
      <stop offset="100%" stop-color="#161b2e"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1100" height="860" fill="url(#bg)" rx="14"/>

  <!-- Header -->
  <rect x="25" y="18" width="1050" height="62" rx="10" fill="url(#cardBg)" stroke="#2d3355" stroke-width="1" filter="url(#shadow)"/>
  <rect x="25" y="18" width="6" height="62" rx="3" fill="url(#headerGrad)"/>
  <text x="50" y="44" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="16" font-weight="700">🚀 Agent-Nuvira Multi-Agent Pipeline</text>
  <text x="50" y="66" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">14 specialized agents · Dependency-aware scheduling · Parallel execution · Self-healing error recovery</text>

  <!-- Orchestrator = central scheduler -->
  <rect x="380" y="98" width="340" height="48" rx="24" fill="url(#orchestrate)" filter="url(#glow)"/>
  <text x="550" y="117" text-anchor="middle" fill="#fff" font-family="system-ui, sans-serif" font-size="14" font-weight="700">⚡ Pipeline Orchestrator</text>
  <text x="550" y="135" text-anchor="middle" fill="#fff" font-family="system-ui, sans-serif" font-size="10" opacity="0.85">Dependency resolver · Event bus · Parallel scheduler · Retry loop</text>

  <!-- Arrow from orchestrator down -->
  <line x1="550" y1="146" x2="550" y2="170" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Stage 1: Plan -->
  <rect x="25" y="178" width="1050" height="30" rx="6" fill="#6366f1" opacity="0.12"/>
  <rect x="25" y="178" width="100" height="30" rx="6" fill="url(#plan)"/>
  <text x="75" y="197" text-anchor="middle" fill="#fff" font-family="system-ui, sans-serif" font-size="11" font-weight="700">📋 1. Plan</text>

  <rect x="140" y="220" width="200" height="52" rx="8" fill="url(#cardBg)" stroke="#6366f1" stroke-width="1" filter="url(#shadow)"/>
  <text x="155" y="241" fill="#818cf8" font-family="system-ui, sans-serif" font-size="12" font-weight="700">🧠 PlannerAgent</text>
  <text x="155" y="258" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Analyzes goals, creates task plans</text>

  <rect x="370" y="220" width="200" height="52" rx="8" fill="url(#cardBg)" stroke="#06b6d4" stroke-width="1" filter="url(#shadow)"/>
  <text x="385" y="241" fill="#22d3ee" font-family="system-ui, sans-serif" font-size="12" font-weight="700">🧠 SkillRunner</text>
  <text x="385" y="258" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Executes compiled skills as plans</text>

  <line x1="240" y1="272" x2="240" y2="294" stroke="#6366f1" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="470" y1="272" x2="470" y2="294" stroke="#06b6d4" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Stage 2: Gather -->
  <rect x="25" y="302" width="1050" height="30" rx="6" fill="#06b6d4" opacity="0.12"/>
  <rect x="25" y="302" width="100" height="30" rx="6" fill="url(#gather)"/>
  <text x="75" y="321" text-anchor="middle" fill="#fff" font-family="system-ui, sans-serif" font-size="11" font-weight="700">📁 2. Gather</text>

  <rect x="140" y="344" width="200" height="52" rx="8" fill="url(#cardBg)" stroke="#06b6d4" stroke-width="1" filter="url(#shadow)"/>
  <text x="155" y="365" fill="#22d3ee" font-family="system-ui, sans-serif" font-size="12" font-weight="700">📂 ContextGatherer</text>
  <text x="155" y="382" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Scans codebase for relevant files</text>

  <rect x="370" y="344" width="200" height="52" rx="8" fill="url(#cardBg)" stroke="#14b8a6" stroke-width="1" filter="url(#shadow)"/>
  <text x="385" y="365" fill="#2dd4bf" font-family="system-ui, sans-serif" font-size="12" font-weight="700">🔌 MCPAgent</text>
  <text x="385" y="382" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Invokes MCP tools from servers</text>

  <rect x="600" y="344" width="200" height="52" rx="8" fill="url(#cardBg)" stroke="#f59e0b" stroke-width="1" filter="url(#shadow)"/>
  <text x="615" y="365" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="12" font-weight="700">🔒 SecurityAgent</text>
  <text x="615" y="382" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Scans PII, injections, dangerous code</text>

  <line x1="240" y1="396" x2="240" y2="418" stroke="#06b6d4" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="470" y1="396" x2="470" y2="418" stroke="#06b6d4" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="700" y1="396" x2="700" y2="418" stroke="#06b6d4" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Stage 3: Write -->
  <rect x="25" y="426" width="1050" height="30" rx="6" fill="#10b981" opacity="0.12"/>
  <rect x="25" y="426" width="100" height="30" rx="6" fill="url(#write)"/>
  <text x="75" y="445" text-anchor="middle" fill="#fff" font-family="system-ui, sans-serif" font-size="11" font-weight="700">✏️ 3. Write</text>

  <rect x="140" y="468" width="200" height="52" rx="8" fill="url(#cardBg)" stroke="#10b981" stroke-width="1" filter="url(#shadow)"/>
  <text x="155" y="489" fill="#34d399" font-family="system-ui, sans-serif" font-size="12" font-weight="700">✏️ WriterAgent</text>
  <text x="155" y="506" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Implements code changes from plan</text>

  <rect x="370" y="468" width="200" height="52" rx="8" fill="url(#cardBg)" stroke="#10b981" stroke-width="1" filter="url(#shadow)"/>
  <text x="385" y="489" fill="#34d399" font-family="system-ui, sans-serif" font-size="12" font-weight="700">▶️ RunnerAgent</text>
  <text x="385" y="506" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Executes shell commands</text>

  <line x1="240" y1="520" x2="240" y2="542" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="470" y1="520" x2="470" y2="542" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Stage 4: Review -->
  <rect x="25" y="550" width="1050" height="30" rx="6" fill="#f59e0b" opacity="0.12"/>
  <rect x="25" y="550" width="100" height="30" rx="6" fill="url(#review)"/>
  <text x="75" y="569" text-anchor="middle" fill="#fff" font-family="system-ui, sans-serif" font-size="11" font-weight="700">👁️ 4. Review</text>

  <rect x="140" y="592" width="200" height="52" rx="8" fill="url(#cardBg)" stroke="#f59e0b" stroke-width="1" filter="url(#shadow)"/>
  <text x="155" y="613" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="12" font-weight="700">👁️ ReviewerAgent</text>
  <text x="155" y="630" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Validates code for bugs &amp; style</text>

  <line x1="240" y1="644" x2="240" y2="666" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Stage 5: Test / Debug -->
  <rect x="25" y="674" width="1050" height="30" rx="6" fill="#ef4444" opacity="0.12"/>
  <rect x="25" y="674" width="130" height="30" rx="6" fill="url(#test)"/>
  <text x="90" y="693" text-anchor="middle" fill="#fff" font-family="system-ui, sans-serif" font-size="11" font-weight="700">🧪 5. Test &amp; Debug</text>

  <rect x="140" y="716" width="200" height="52" rx="8" fill="url(#cardBg)" stroke="#ef4444" stroke-width="1" filter="url(#shadow)"/>
  <text x="155" y="737" fill="#f87171" font-family="system-ui, sans-serif" font-size="12" font-weight="700">🧪 TesterAgent</text>
  <text x="155" y="754" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Runs tests in sandboxed env</text>

  <rect x="370" y="716" width="200" height="52" rx="8" fill="url(#cardBg)" stroke="#ef4444" stroke-width="1" filter="url(#shadow)"/>
  <text x="385" y="737" fill="#f87171" font-family="system-ui, sans-serif" font-size="12" font-weight="700">🐛 DebuggerAgent</text>
  <text x="385" y="754" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Fixes test failures iteratively</text>

  <!-- Note row: re-run loop from Debugger back to Writer (via orchestrator) -->
  <path d="M470,742 Q520,742 520,710 Q520,494 470,494" fill="none" stroke="#f87171" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow)"/>
  <text x="540" y="620" fill="#f87171" font-family="system-ui, sans-serif" font-size="9" font-style="italic">retry loop</text>



  <!-- Bottom Metrics Bar -->
  <rect x="25" y="795" width="1050" height="42" rx="8" fill="url(#cardBg)" stroke="#2d3355" stroke-width="1"/>
  
  <circle cx="90" cy="816" r="6" fill="#10b981"/>
  <text x="104" y="820" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">14 agent types</text>

  <line x1="220" y1="802" x2="220" y2="834" stroke="#2d3355" stroke-width="1"/>
  <circle cx="270" cy="816" r="6" fill="#06b6d4"/>
  <text x="284" y="820" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Dependency-aware scheduling</text>

  <line x1="480" y1="802" x2="480" y2="834" stroke="#2d3355" stroke-width="1"/>
  <circle cx="530" cy="816" r="6" fill="#f59e0b"/>
  <text x="544" y="820" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Parallel execution</text>

  <line x1="700" y1="802" x2="700" y2="834" stroke="#2d3355" stroke-width="1"/>
  <circle cx="750" cy="816" r="6" fill="#ef4444"/>
  <text x="764" y="820" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Error recovery (3 attempts)</text>

  <line x1="930" y1="802" x2="930" y2="834" stroke="#2d3355" stroke-width="1"/>
  <circle cx="970" cy="816" r="6" fill="#6366f1"/>
  <text x="984" y="820" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Plugin SDK</text>

  <!-- Side labels for Ship & Publish -->
  <rect x="830" y="220" width="220" height="52" rx="8" fill="url(#cardBg)" stroke="#a78bfa" stroke-width="1" filter="url(#shadow)"/>
  <text x="845" y="241" fill="#c4b5fd" font-family="system-ui, sans-serif" font-size="12" font-weight="700">🔀 GitAgent</text>
  <text x="845" y="258" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Branch, commit, PRs</text>

  <rect x="830" y="344" width="220" height="52" rx="8" fill="url(#cardBg)" stroke="#f472b6" stroke-width="1" filter="url(#shadow)"/>
  <text x="845" y="365" fill="#f9a8d4" font-family="system-ui, sans-serif" font-size="12" font-weight="700">📦 PackageAgent</text>
  <text x="845" y="382" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Version, build, npm publish</text>

  <rect x="830" y="468" width="220" height="52" rx="8" fill="url(#cardBg)" stroke="#c084fc" stroke-width="1" filter="url(#shadow)"/>
  <text x="845" y="489" fill="#c4b5fd" font-family="system-ui, sans-serif" font-size="12" font-weight="700">🏷️ GitHubRelease</text>
  <text x="845" y="506" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Release + changelog</text>

  <!-- Connecting lines from Reviewer to Ship/Publish agents -->
  <path d="M340,618 L830,246" stroke="#a78bfa" stroke-width="1" stroke-dasharray="4,3" opacity="0.5"/>
  <path d="M340,618 L830,370" stroke="#f472b6" stroke-width="1" stroke-dasharray="4,3" opacity="0.5"/>
  <path d="M340,618 L830,494" stroke="#c084fc" stroke-width="1" stroke-dasharray="4,3" opacity="0.5"/>

  <!-- Cross-pipeline MCP linking -->
  <rect x="830" y="592" width="220" height="52" rx="8" fill="url(#cardBg)" stroke="#14b8a6" stroke-width="1" filter="url(#shadow)"/>
  <text x="845" y="613" fill="#2dd4bf" font-family="system-ui, sans-serif" font-size="12" font-weight="700">🔌 MCP Agent</text>
  <text x="845" y="630" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Model Context Protocol tools</text>

  <!-- Sidebar labels -->
  <text x="940" y="218" fill="#a78bfa" font-family="system-ui, sans-serif" font-size="9" font-weight="600">SHIP</text>
  <text x="940" y="342" fill="#f472b6" font-family="system-ui, sans-serif" font-size="9" font-weight="600">PUBLISH</text>
  <text x="940" y="466" fill="#c084fc" font-family="system-ui, sans-serif" font-size="9" font-weight="600">RELEASE</text>
  <text x="940" y="590" fill="#2dd4bf" font-family="system-ui, sans-serif" font-size="9" font-weight="600">EXTEND</text>
</svg>
