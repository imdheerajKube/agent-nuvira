# Publish — automated release workflow
#
# Triggered when a tag matching "v*" is pushed (e.g., v1.14.0).
# Publishes the package to:
#   1. npm (public registry)
#   2. GitHub Packages (under @imdheerajKube scope)
#
# Also creates a GitHub Release with auto-generated release notes.
#
# Prerequisites:
#   - NPM_TOKEN secret set in GitHub repository settings
#   - GITHUB_TOKEN is automatically provided by GitHub Actions

name: publish

on:
  push:
    tags:
      # Only version tags like v1.40.0 — NOT vscode-v* extension tags
      - 'v[0-9]*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Node ${{ matrix.node-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        node-version:
          - 22
          - 23
    # The full suite (428 files) runs ~6 min on ubuntu but ~2x that on the
    # slower windows runners, so a 10-minute cap killed the windows jobs mid-run
    # ("exceeded the maximum execution time") while ubuntu passed. Keep the cap
    # generous enough that slowness cannot be mistaken for a failure.
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      # Explicit release contract gate — system-prompt budget, the skill
      # catalog staying opt-in, the toolchain-install clause, and the
      # software-routing policy. Also covered by the full suite below, but named
      # here so a regression fails FAST under a step that says what broke. This
      # is the gate that would have caught v3.3.11 (a 7,653 -> 32,809-char
      # prompt) before it reached users.
      - name: Agent behaviour contracts (release gate)
        run: npm run gate:contracts
        env:
          CI: true
          NO_COLOR: '1'

      # --reporter=dot, not verbose: verbose prints ~8k per-test lines, and on
      # the slower windows runners that log I/O is a measurable slice of the
      # job — MEASURED locally at ~3m40s verbose vs ~2m46s dot for the full
      # suite. dot still prints every failure with its full detail.
      - name: Run tests
        run: npx vitest run --reporter=dot
        env:
          CI: true
          NODE_OPTIONS: --no-warnings

  publish-npm:
    name: Publish to npm
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      # Idempotency guard: re-running a release (or re-tagging) must not fail
      # because the version already exists on the registry. Skip if present.
      - name: Check if version already published on npm
        id: npm-version-check
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "agent-nuvira@${VERSION}" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "agent-nuvira@${VERSION} already published to npm — skipping publish."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: steps.npm-version-check.outputs.exists != 'true'
        run: |
          echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" > .npmrc
          npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-github:
    name: Publish to GitHub Packages
    needs: test
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      # Map the scope to GH Packages — without this, npm publishes a
      # scoped package to registry.npmjs.org by default, where the
      # GITHUB_TOKEN is not valid (ENEEDAUTH).
      - name: Map scope to GitHub Packages registry
        run: echo "@imdheerajKube:registry=https://npm.pkg.github.com/" >> .npmrc

      # Idempotency guard (same rationale as the npm job).
      - name: Check if version already published to GitHub Packages
        id: gh-version-check
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "@imdheerajKube/agent-nuvira@${VERSION}" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "@imdheerajKube/agent-nuvira@${VERSION} already published — skipping publish."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to GitHub Packages
        if: steps.gh-version-check.outputs.exists != 'true'
        run: |
          # Temporarily scope the package name for GitHub Packages
          node -e "
            const pkg = require('./package.json');
            pkg.name = '@imdheerajKube/' + pkg.name;
            require('fs').writeFileSync('package.json', JSON.stringify(pkg, null, 2));
          "
          npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release:
    name: Create GitHub Release
    needs: [publish-npm, publish-github]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          name: Agent-Nuvira ${{ github.ref_name }}
          body: |
            ## What's Changed

            See the full changelog below for all changes in this release.

            ## Installation

            ```bash
            npm install -g agent-nuvira
            # or update
            npm update -g agent-nuvira
            ```

            ## Quick Links

            - [Documentation](https://github.com/imdheerajKube/agent-nuvira-documentation#readme)
            - [User Manual](https://github.com/imdheerajKube/agent-nuvira-documentation/blob/main/docs/user-manual.md)
            - [npm Package](https://www.npmjs.com/package/agent-nuvira)
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
