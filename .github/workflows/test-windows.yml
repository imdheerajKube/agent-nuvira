# Windows CI — runs the test suite on Windows runners to catch cross-platform regressions.
# Triggered on push/PR to main, and can be run manually.
#
# This workflow verifies that agent-nuvira works correctly on Windows,
# which is critical since the tool uses child_process (execSync), temp directories,
# path manipulation, and other platform-sensitive operations.
#
# Two jobs:
#   1. runner-tests — fast feedback: runs only RunnerAgent + sandbox tests (the most
#      Windows-sensitive tests). Completes in < 30s.
#   2. full-suite — comprehensive: runs all tests across Node 22 and 23.
#
# Note: Vitest 4.x dependencies (rolldown) require Node >= 21.7 for `node:util.styleText`.
# Only Node 22+ is tested here. For older Node versions, use vitest 3.x or older.

name: test-windows

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      node_version:
        description: 'Node.js version to test'
        required: false
        default: '22'
        type: choice
        options:
          - '22'
          - '23'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  NODE_OPTIONS: --no-warnings

jobs:
  # ── Fast-feedback: runner & sandbox tests (most Windows-sensitive) ───────────
  runner-tests:
    name: Runner tests (Node ${{ matrix.node-version }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 22
          - 23
    # Windows runners are the slowest of the three platforms.
    timeout-minutes: 12

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci
        shell: bash

      - name: Build project
        run: npm run build
        shell: bash

      - name: Run runner + sandbox tests
        run: npx vitest run tests/agents/agents/runner.test.ts tests/sandbox/manager.test.ts --reporter=verbose
        shell: bash

  # ── Full test suite (Node 22 & 23) ───────────────────────────────────────────
  full-suite:
    name: Full test suite (Node ${{ matrix.node-version }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 22
          - 23
    # The full suite (~5.8k tests, ~9 min on a fast dev machine) has never
    # actually completed in CI: every run died in "Build project" after ~15s, so
    # this cap was never calibrated. Windows needs the most headroom.
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci
        shell: bash

      - name: Build project
        run: npm run build
        shell: bash

      # The generated surface doc + the dashboard's commands.json picker are
      # derived from the live command tree; a command added or renamed without
      # regenerating leaves both stale. Windows is a useful second check of the
      # generator's path handling (it imports dist via a file URL, which used to
      # throw on a bare `D:\...` path).
      - name: Command registry in sync (surface doc + dashboard catalogue)
        run: npm run docs:commands:check
        shell: bash
        env:
          NO_COLOR: '1'

      # Registered != runnable. Executes every documented command with
      # `nuvira <cmd> --help` so a command that only resolves in the docs fails
      # in CI instead of for a user. Windows matters most here: argv/path
      # handling is exactly where a command that works on Unix breaks.
      - name: Verify every command resolves (nuvira <cmd> --help)
        run: npm run verify:commands
        shell: bash
        env:
          NO_COLOR: '1'

      # A source file that cites a design/tracker doc by name must cite one that
      # exists AND is tracked (`*.md` is gitignored unless whitelisted — that is
      # how TOOL_TRUTHFULNESS_TRACKER.md was lost with eight modules citing it).
      # Also asserted in tests/docs/doc-citations.test.ts.
      - name: Doc citations resolve (cited *.md exists and is tracked)
        run: npm run docs:citations:check
        shell: bash
        env:
          NO_COLOR: '1'

      - name: Run all tests
        run: npx vitest run --reporter=verbose
        shell: bash

      # The same real-browser walk the Unix gate runs, on the platform where
      # argv/path/spawn handling is the usual suspect: it serves the COMMITTED
      # bundle, launches headless Chrome, and walks every linked route +
      # keyboard layer. Needs no dashboard node_modules (it reads public/), so
      # it runs in this job as-is. --require-chrome makes a missing browser a
      # failure instead of a silent skip. Two themes here (not the Unix gate's
      # four) to bound time on the slowest runner; the shell and keyboard are
      # engine behaviour, not palette behaviour, so two modes cover it.
      - name: Dashboard browser walk (routes + keyboard)
        if: matrix.node-version == 22
        run: npm run smoke:dashboard -- --require-chrome --themes enterprise:light,enterprise:dark
        shell: bash
        env:
          CI: true

      # Real (trusted) mouse and key events over CDP. Exactly as valuable on
      # Windows as on Unix, and for a different reason: the bug that created
      # this script only reproduced on macOS (Windows focuses a control on
      # mouse-down, so the labelled-radio blur never fired), which is precisely
      # why a single-platform green run cannot be trusted to mean "the panel
      # works". The assertions themselves are engine-independent.
      - name: Dashboard trusted input (real clicks + keys)
        if: matrix.node-version == 22
        run: npm run smoke:dashboard:input -- --require-chrome
        shell: bash
        env:
          CI: true

      # The SDK example is a real consumer of the published package surface.
      # Windows matters here: path handling in the example's configs is exactly
      # where a Linux-only setup breaks.
      - name: SDK example (typecheck + tests)
        run: npm run examples:verify
        shell: bash
        env:
          CI: true
