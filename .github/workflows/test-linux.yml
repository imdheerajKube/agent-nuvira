# Linux + macOS CI — runs the test suite on Ubuntu and macOS runners alongside the Windows CI.
# Triggered on push/PR to main, and can be run manually.
#
# Covers all major desktop platforms: Ubuntu (primary dev environment), macOS (important for
# Homebrew users and devs), and Windows (separate test-windows.yml).
#
# Note: Vitest 4.x dependencies (rolldown) require Node >= 21.7 for `node:util.styleText`.
# Only Node 22+ is tested here. For older Node versions, use vitest 3.x or older.

name: test-unix

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      node_version:
        description: 'Node.js version to test'
        required: false
        default: '22'
        type: choice
        options:
          - '22'
          - '24'
          - '26'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} (Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
        node-version:
          - 22
          - 24
          - 26
    # Budgets calibrated against the REAL suite size (~5.8k tests, ~9 min on a
    # fast dev machine). Until the dashboard-build fix landed, every job died in
    # "Build project" after ~15s, so these numbers had never been tested against
    # a full run. macOS runners are slower than Linux, so it gets more headroom.
    timeout-minutes: ${{ matrix.os == 'macos-latest' && 30 || 25 }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      # The command surface has ONE source of truth (`src/cli/cli-program.ts`)
      # and TWO generated artifacts: `docs/COMMANDS_SURFACE.md` and the
      # dashboard's `commands.json` picker catalogue. A command added, renamed,
      # or removed without regenerating leaves the docs — and the picker —
      # describing a CLI that no longer exists. This is the drift guard: it
      # regenerates from the BUILT tree and diffs both outputs. It runs on the
      # one platform-agnostic combo, right after the build it depends on.
      - name: Command registry in sync (surface doc + dashboard catalogue)
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == '22'
        run: npm run docs:commands:check
        env:
          NO_COLOR: '1'

      # Every command in the documented surface must be RUNNABLE, not merely
      # registered. The generated surface proves a command EXISTS in the
      # commander tree; this executes each one with `nuvira <cmd> --help` so a
      # command that resolves only in the doc (a sub-parser never attached, an
      # import that throws on that code path) fails here instead of for a user.
      # Safe by construction: --help never runs the action.
      - name: Verify every command resolves (nuvira <cmd> --help)
        run: npm run verify:commands
        env:
          NO_COLOR: '1'

      # A source file that cites a design/tracker doc by name must cite one that
      # exists AND is tracked. `*.md` is gitignored unless whitelisted, which is
      # how TOOL_TRUTHFULNESS_TRACKER.md was lost while eight modules still
      # referenced it — silently, until a human noticed. The same invariant is
      # asserted by tests/docs/doc-citations.test.ts; this step names it in the
      # log instead of surfacing it as one more failed test.
      - name: Doc citations resolve (cited *.md exists and is tracked)
        run: npm run docs:citations:check
        env:
          NO_COLOR: '1'

      # Nuvira-Router M0.1 regression gate (baseline lock). Runs BEFORE the
      # full suite so a routing/learning regression fails fast with a clearly
      # labeled step. Covers: bandit / promotion / auto-router / tier0 /
      # hybrid / model-registry / provider-fallback + the hermetic
      # failover-learning E2E (mock-429 -> learn -> skip -> recover).
      # Full gate: bash scripts/ci/regression-gate.sh (adds root + dashboard
      # suites); --fast is the CI fast-path.
      - name: Nuvira-Router regression gate (baseline lock)
        run: bash scripts/ci/regression-gate.sh --fast
        env:
          CI: true
          NODE_OPTIONS: --no-warnings

      - name: Run tests
        run: npx vitest run --reporter=verbose
        env:
          CI: true
          NODE_OPTIONS: --no-warnings

      # The SDK example is a real consumer of the published package surface:
      # it type-checks against the local SDK source and runs its own suite, so
      # an export the example needs but the SDK stopped shipping fails here.
      # Runs on ONE matrix combo (platform-agnostic) to avoid redundant runs.
      - name: SDK example (typecheck + tests)
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == '22'
        run: npm run examples:verify
        env:
          CI: true

      # Frontend component tests — the dashboard has its own package (react +
      # vite) with a committed lockfile; npm ci keeps the install hermetic and
      # --foreground-scripts ensures native install scripts (esbuild) run.
      # Version note: the dashboard intentionally uses vitest 3.x (pairs with
      # vite 5/esbuild 0.21) while the ROOT suite uses vitest 4.x — they are
      # separate package trees. The tests are pure jsdom and platform-agnostic,
      # so this step runs on ONE matrix combo instead of all four to avoid 3
      # redundant npm ci runs.
      #
      # `npm test` (not `npx vitest run`): the dashboard bundle is built by vite,
      # which strips types without checking them, so nothing else would ever
      # notice a type error in that tree. The test script typechecks first.
      - name: Dashboard component tests (PromotionGateSection)
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == '22'
        run: cd src/web-dashboard && npm ci --no-audit --no-fund --foreground-scripts && npm test
        env:
          CI: true

      # The dashboard bundle is a COMMITTED build artifact (the server serves
      # src/web-dashboard/public straight from the repo), so nothing else here
      # notices when it is not the bundle the source builds — the component tests
      # run the source, so they pass either way. This caught a real case: the
      # Subagents tab was written, reviewed and committed while the shipped
      # bundle did not contain it. --rebuild is the complete check (a byte
      # comparison against a fresh build); it needs the tree installed above.
      - name: Dashboard bundle matches its source
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == '22'
        run: npm run dashboard:bundle:check -- --rebuild
        env:
          CI: true

      # A real browser walk of every route a nav link reaches, in four theme
      # combinations, against the COMMITTED bundle. The jsdom suite renders one
      # component at a time and cannot see a route nothing links to, a skipped
      # heading level on a page, the theme the user chose never actually
      # applying, or the shell's keyboard layer (a focus-trapping `?` dialog,
      # the `g`-chord). The earlier throwaway harness read the wrong
      # localStorage key, so those walks silently tested the DEFAULT theme —
      # this script asserts data-palette/data-mode before it trusts a page.
      # --require-chrome turns a missing browser into a failure: the ubuntu
      # runner image ships Chrome, so "no Chrome" here is a broken runner, not
      # an absent one. The Windows gate runs the same walk over two themes
      # (see test-windows.yml): there the value is argv/path/spawn handling, so
      # it needs the route + keyboard checks, not all four palettes.
      - name: Dashboard browser walk (routes + themes + keyboard)
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == '22'
        run: npm run smoke:dashboard -- --require-chrome
        env:
          CI: true

      # The walk above drives the page with events the harness creates itself,
      # which cannot reproduce a BROWSER DEFAULT ACTION. A `<label>` forwarding
      # its click to a visually-hidden radio is exactly that, and it broke the
      # Appearance panel for every real mouse user while ~850 jsdom tests (which
      # click the input directly) and the walk both stayed green. This step
      # sends trusted Input.dispatchMouseEvent/KeyEvent over CDP: it must be
      # able to open the panel, choose a mode, choose a palette, flip the
      # accessibility switch and reset — all with real clicks — and the rail
      # must still be its own surface with a visible active pill.
      - name: Dashboard trusted input (real clicks + keys)
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == '22'
        run: npm run smoke:dashboard:input -- --require-chrome
        env:
          CI: true

  # Bun latest — validates the full root suite under the Bun runtime (M4).
  # Bun can run vitest via bunx; the tsc typecheck is part of the gate so a
  # Bun-specific resolution regression is caught the same way Node catches it.
  bun:
    name: ubuntu-latest (Bun latest)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Build project
        run: bun run build

      - name: Run tests
        run: bunx vitest run --reporter=verbose
        env:
          CI: true
