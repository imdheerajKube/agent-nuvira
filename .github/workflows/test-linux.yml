# Linux + macOS CI — runs the test suite on Ubuntu and macOS runners alongside the Windows CI.
# Triggered on push/PR to main, and can be run manually.
#
# Covers all major desktop platforms: Ubuntu (primary dev environment), macOS (important for
# Homebrew users and devs), and Windows (separate test-windows.yml).
#
# Note: Vitest 4.x dependencies (rolldown) require Node >= 21.7 for `node:util.styleText`.
# Only Node 22+ is tested here. For older Node versions, use vitest 3.x or older.

name: test-unix

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      node_version:
        description: 'Node.js version to test'
        required: false
        default: '22'
        type: choice
        options:
          - '22'
          - '23'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} (Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
        node-version:
          - 22
          - 23
    # macOS runners are 2-3x slower than Linux; Ubuntu tests finish quickly
    timeout-minutes: ${{ matrix.os == 'macos-latest' && 15 || 10 }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      # Regression guard for the learning router: uncertainty escalation,
      # per-model bandit priors, and the promotion gate. Runs BEFORE the full
      # suite so a routing regression fails fast with a clearly-labeled step
      # (this is the exact area that shipped in v1.42.0).
      - name: Routing regression guard (bandit / promotion gate)
        run: npx vitest run tests/learning/router-bandit.test.ts tests/learning/router-promotion.test.ts tests/learning/auto-router.test.ts tests/learning/tier0-router.test.ts
        env:
          CI: true
          NODE_OPTIONS: --no-warnings

      - name: Run tests
        run: npx vitest run --reporter=verbose
        env:
          CI: true
          NODE_OPTIONS: --no-warnings

      # Frontend component tests — the dashboard has its own package (react +
      # vite) with a committed lockfile; npm ci keeps the install hermetic and
      # --foreground-scripts ensures native install scripts (esbuild) run.
      - name: Dashboard component tests (PromotionGateSection)
        run: cd src/web-dashboard && npm ci --no-audit --no-fund --foreground-scripts && npx vitest run
        env:
          CI: true
